{{- if .Values.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{- if .Values.serviceAccount.name }} "{{ .Values.serviceAccount.name }}"{{- else }} "{{ .Values.appName }}-{{ .Values.environment }}"{{- end }}
  labels:
    app: "{{ .Values.appName }}-{{ .Values.environment }}"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
{{- end }}
