{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{- if .Values.serviceAccount.name }} "{{ .Values.serviceAccount.name }}"{{- else }} "{{ .Values.appName }}-{{ .Values.environment }}"{{- end }}
  labels:
    app: "{{ .Values.appName }}-{{ .Values.environment }}"
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
